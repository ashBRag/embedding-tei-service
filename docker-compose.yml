services:
  # Single API service with dynamic environment
  app:
    build:
      context: .
      args:
        APP_ENV: ${APP_ENV:-development}
    ports:
      - "8002:8000"
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    env_file:
      # Shared infra values (Postgres, Redis, Kafka/Redpanda, TEI, AWS/LocalStack, ...)
      # come from the infra stack's own .env - loaded first so this service's
      # own .env.${APP_ENV} (listed second) can still override anything if needed.
      - ../../Dev Arsenal/Infrastructure/dev-stack/.env
      - .env.${APP_ENV:-development}
    environment:
      - APP_ENV=${APP_ENV:-development}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure
    networks:
      - backend-internal

networks:
  backend-internal:
    external: true
